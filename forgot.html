
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack - Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="brand-icon">JT</div>
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your registered email and new password.</p>

        <form onsubmit="resetPassword(event)">
            <label>Email Address</label>
            <input type="email" id="resetEmail"
                   placeholder="Enter registered email" required>

            <label>New Password</label>
            <input type="password" id="newPassword"
                   placeholder="Enter new password" minlength="6" required>

            <label>Confirm New Password</label>
            <input type="password" id="confirmNewPassword"
                   placeholder="Confirm new password" required>

            <button type="submit" class="primary-btn full-btn">
                Reset Password
            </button>
        </form>

        <p class="bottom-text">
            <a href="index.html">Back to Login</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
