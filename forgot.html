
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobPortal | Forgot Password</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="forgot">

  <header class="site-header">
    <a class="brand" href="index.html">JobPortal</a>
    <nav><a href="index.html">Login</a></nav>
  </header>

  <main class="auth-layout">
    <form id="forgotForm" class="panel auth-card">

      <div class="eyebrow">ACCOUNT HELP</div>
      <h1>Reset Password</h1>
      <p class="muted">Enter your registered email and choose a new password.</p>

      <label for="email">Registered Email</label>
      <input id="email" type="email" placeholder="Enter your email" required>

      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password"
        placeholder="Enter new password" minlength="6" required>

      <label for="confirmPassword">Confirm New Password</label>
      <input id="confirmPassword" type="password"
        placeholder="Confirm new password" minlength="6" required>

      <button class="btn btn-primary btn-block" type="submit">
        Reset Password
      </button>

      <p id="message" class="form-message" aria-live="polite"></p>

      <p class="auth-bottom">
        <a href="index.html">Back to Login</a>
      </p>

    </form>
  </main>

  <footer class="site-footer">
    © 2026 JobPortal | Academic Project
  </footer>

</body>
</html>
