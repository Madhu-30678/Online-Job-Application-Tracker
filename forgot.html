
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack | Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <main class="auth-card">
        <div class="brand-icon">JT</div>
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your registered email and new password.</p>

        <form onsubmit="resetPassword(event)">
            <label for="resetEmail">Registered Email</label>
            <input type="email" id="resetEmail"
                   placeholder="Enter your email" required>

            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword"
                   placeholder="Minimum 6 characters"
                   minlength="6" required>

            <label for="confirmNewPassword">Confirm New Password</label>
            <input type="password" id="confirmNewPassword"
                   placeholder="Confirm new password" required>

            <button type="submit" class="primary-btn full-btn">
                Reset Password
            </button>
        </form>

        <p class="bottom-text">
            <a href="index.html">Back to Login</a>
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
