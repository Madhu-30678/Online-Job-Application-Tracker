<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard - Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Online Job Application Tracker</h1>
    <h2>User Dashboard</h2>

    <h3>Application Statistics</h3>

    <div id="stats" class="stats">
        <div class="stat-card">
            <h3 id="totalCount">0</h3>
            <p>Total Applications</p>
        </div>

        <div class="stat-card">
            <h3 id="appliedCount">0</h3>
            <p>Applied</p>
        </div>

        <div class="stat-card">
            <h3 id="interviewCount">0</h3>
            <p>Interview</p>
        </div>

        <div class="stat-card">
            <h3 id="selectedCount">0</h3>
            <p>Selected</p>
        </div>

        <div class="stat-card">
            <h3 id="rejectedCount">0</h3>
            <p>Rejected</p>
        </div>
    </div>

    <hr>

    <button onclick="showForm()">Add Job Application</button>

    <div id="form" style="display:none;">
        <h3>Add Job Application</h3>

        <input type="text" id="company" placeholder="Company Name">
        <input type="text" id="role" placeholder="Job Role">

        <select id="status">
            <option value="Applied">Applied</option>
            <option value="Interview">Interview</option>
            <option value="Selected">Selected</option>
            <option value="Rejected">Rejected</option>
        </select>

        <button onclick="addJob()">Save Application</button>
    </div>

    <hr>

    <h3>My Applications</h3>

    <input
        type="text"
        id="search"
        placeholder="Search by company name"
        oninput="showJobs()"
    >

    <select id="filterStatus" onchange="showJobs()">
        <option value="All">All Statuses</option>
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Selected">Selected</option>
        <option value="Rejected">Rejected</option>
    </select>

    <div id="jobs"></div>

    <button onclick="logout()">Logout</button>

</div>

<script src="script.js"></script>
<script>
    showJobs();
</script>

</body>
</html>
