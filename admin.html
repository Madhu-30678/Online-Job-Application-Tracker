
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

    <header class="topbar">
        <div class="topbar-brand">JobTrack Admin</div>
        <div class="topbar-actions">
            <span>Administrator</span>
            <button onclick="adminLogout()" class="logout-btn">Logout</button>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="page-heading">
            <div>
                <h1>Admin Dashboard</h1>
                <p>Monitor registered users and job applications.</p>
            </div>
        </div>

        <section class="stats admin-stats">
            <div class="stat-card">
                <span>Registered Users</span>
                <h2 id="adminUserCount">0</h2>
            </div>
            <div class="stat-card">
                <span>Total Applications</span>
                <h2 id="adminJobCount">0</h2>
            </div>
        </section>

        <section class="panel">
            <h2>Registered Users</h2>
            <div id="usersList"></div>
        </section>

        <section class="panel">
            <h2>All Job Applications</h2>
            <input type="search" id="adminSearch"
                   placeholder="Search by company, role or user email..."
                   oninput="showAllJobs()">
            <div id="allJobs"></div>
        </section>

        <footer class="footer">
            JobTrack Administration | Academic Project
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
