
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobPortal | Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="login">

  <header class="site-header">
    <a class="brand" href="index.html">JobPortal</a>
    <nav>
      <a href="signup.html">Create Account</a>
    </nav>
  </header>

  <main class="auth-layout">
    <form id="loginForm" class="panel auth-card">

      <div class="eyebrow">WELCOME BACK</div>
      <h1>Sign in to JobPortal</h1>
      <p class="muted">Find opportunities and manage your applications.</p>

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button class="btn btn-primary btn-block" type="submit">
        Login
      </button>

      <p id="message" class="form-message" aria-live="polite"></p>

      <div class="auth-links">
        <a href="forgot.html">Forgot Password?</a>
        <span>New user? <a href="signup.html">Create Account</a></span>
      </div>

      <div class="demo-note">
        <strong>Demo Admin Login</strong><br>
        Email: admin@gmail.com<br>
        Password: admin123
      </div>

    </form>
  </main>

  <footer class="site-footer">
    © 2026 JobPortal | Academic Project
  </footer>

</body>
</html>
