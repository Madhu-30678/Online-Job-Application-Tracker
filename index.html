
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="brand-icon">JT</div>
        <h1>JobTrack</h1>
        <p class="subtitle">Online Job Application Tracker</p>

        <h2>Welcome Back!</h2>
        <p class="muted">Login to manage your job applications.</p>

        <form onsubmit="login(event)">
            <label>Email Address</label>
            <input type="email" id="loginEmail"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="loginPassword"
                   placeholder="Enter your password" required>

            <button type="submit" class="primary-btn full-btn">
                Login
            </button>
        </form>

        <a class="forgot-link" href="forgot.html">Forgot Password?</a>

        <div class="auth-divider">OR</div>

        <a href="signup.html" class="secondary-btn full-btn">
            Create New Account
        </a>

        <a href="admin.html" class="admin-link">Admin Login</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
