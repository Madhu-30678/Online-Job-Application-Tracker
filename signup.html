
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobPortal | Signup</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="signup">

  <header class="site-header">
    <a class="brand" href="index.html">JobPortal</a>
    <nav><a href="index.html">Login</a></nav>
  </header>

  <main class="auth-layout">
    <form id="signupForm" class="panel auth-card">

      <div class="eyebrow">GET STARTED</div>
      <h1>Create Your Account</h1>
      <p class="muted">Join JobPortal as a job seeker or recruiter.</p>

      <label for="name">Full Name</label>
      <input id="name" type="text" placeholder="Enter your full name"
        autocomplete="name" maxlength="70" required>

      <label for="email">Email Address</label>
      <input id="email" type="email" placeholder="Enter your email"
        autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        placeholder="At least 6 characters"
        minlength="6" autocomplete="new-password" required>

      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password"
        placeholder="Re-enter your password"
        minlength="6" autocomplete="new-password" required>

      <label for="role">Account Type</label>
      <select id="role" required>
        <option value="user">Job Seeker</option>
        <option value="recruiter">Recruiter</option>
      </select>

      <button class="btn btn-primary btn-block" type="submit">
        Create Account
      </button>

      <p id="message" class="form-message" aria-live="polite"></p>

      <p class="auth-bottom">
        Already registered?
        <a href="index.html">Login here</a>
      </p>

    </form>
  </main>

  <footer class="site-footer">
    © 2026 JobPortal | Academic Project
  </footer>

</body>
</html>
