
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrack - Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="brand-icon">JT</div>
        <h1>Create Account</h1>
        <p class="subtitle">Start tracking your job applications.</p>

        <form onsubmit="signup(event)">
            <label>Full Name</label>
            <input type="text" id="signupName"
                   placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="signupEmail"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="signupPassword"
                   placeholder="Create a password" minlength="6" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Confirm your password" required>

            <button type="submit" class="primary-btn full-btn">
                Create Account
            </button>
        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="index.html">Login here</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
